allprojects {
    repositories {
        google()
        mavenCentral()
    }
}

// Move root build directory up two levels so all modules share a single top-level build folder
// Use the Flutter project root's build directory (one level up from android/)
def newBuildDir = file('../build')
rootProject.buildDir = newBuildDir

subprojects {
    // Each subproject will place its outputs inside the shared top-level build folder
    project.buildDir = new File(rootProject.buildDir, project.name)
}

subprojects {
    // Configure android compile options when Android plugins are applied
    plugins.withId('com.android.application') {
        android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
        android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
    }

    plugins.withId('com.android.library') {
        android.compileOptions.sourceCompatibility = JavaVersion.VERSION_17
        android.compileOptions.targetCompatibility = JavaVersion.VERSION_17
    }
}


tasks.register("clean", Delete) {
    delete rootProject.buildDir
}


